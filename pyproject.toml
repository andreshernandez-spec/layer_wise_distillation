[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lwd"
version = "0.0.1"
description = "Stagewise noise distillation: harvest, contract, stage training, heal"
requires-python = ">=3.11"
dependencies = ["numpy", "torch>=2.6", "safetensors"]

[project.optional-dependencies]
harvest = ["transformers>=4.45", "huggingface_hub", "zstandard", "pyyaml"]
eval = ["lm_eval>=0.4", "datasets"]
dev = ["pytest", "hypothesis", "matplotlib", "pyyaml"]

[tool.hatch.build.targets.wheel]
packages = ["src/lwd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
