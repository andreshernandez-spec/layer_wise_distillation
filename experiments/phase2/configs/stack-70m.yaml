# Exp 1 primary cell config (docs/02): Pythia-1.4B stage 2 (blocks 8-11),
# 2-block same-width student, ZCA contract both sides.
model: EleutherAI/pythia-70m
n_stages: 3
stage: 0
slice: out/slice/anchor_rows.npy
decontam: out/slice/decontam.json
stitch_seqs: 4   # 64 x 2048 held-out-from-anchors positions for the stitching delta
harvest: out/harvest-70m-smoke
contract: zca
d_s: null
student_layers: 1
student_heads: 8
eval_seqs: 2          # 48 x 2048 ~ 1e5 held-out positions; the rest of the 512 refs are anchors
mix_real_frac: 0.0909  # 1:10
device: cpu
dtype: float32
train: {batch: 2, seq_len: 256, lr: 3.0e-4, warmup: 100, weight_decay: 0.1, grad_clip: 1.0, eval_every: 200, log_every: 20, amp: true}
out: out/phase2-70m
heldout: out/heldout/heldout_rows.npy
heal_batch: 1
heal_lr: 1.0e-4
