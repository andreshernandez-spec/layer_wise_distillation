# Exp 1 primary cell config (docs/02): Pythia-1.4B stage 2 (blocks 8-11),
# 2-block same-width student, ZCA contract both sides.
model: EleutherAI/pythia-1.4b
n_stages: 6
stage: 2
slice: out/slice/anchor_rows.npy
decontam: out/slice/decontam.json
stitch_seqs: 64   # 64 x 2048 held-out-from-anchors positions for the stitching delta
harvest: out/harvest-1.4b
contract: zca
d_s: null
student_layers: 2
student_heads: 16
eval_seqs: 48          # 48 x 2048 ~ 1e5 held-out positions; the rest of the 512 refs are anchors
mix_real_frac: 0.0909  # 1:10
device: cuda
dtype: float16
train: {batch: 8, seq_len: 2048, lr: 3.0e-4, warmup: 100, weight_decay: 0.1, grad_clip: 1.0, eval_every: 200, log_every: 20, amp: true}
anchor_seqs_used: 184
out: out/phase1-1.4b-a100
